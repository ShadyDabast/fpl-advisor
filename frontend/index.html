<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FPL Advisor</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>⚽ FPL Advisor</h1>
    <p class="subtitle">AI-powered Fantasy Premier League advice</p>
    <div id="user-bar" class="user-bar hidden">
      <span id="username-display"></span>
      <button id="logout-btn">Log out</button>
    </div>
  </header>

  <section id="auth-panel" class="panel">
    <div class="auth-tabs">
      <button id="tab-login" class="tab active">Log In</button>
      <button id="tab-register" class="tab">Register</button>
    </div>

    <form id="login-form" class="auth-form">
      <input type="text" id="login-username" placeholder="Username" required />
      <input type="password" id="login-password" placeholder="Password" required />
      <button type="submit">Log In</button>
      <p class="auth-error" id="login-error"></p>
    </form>

    <form id="register-form" class="auth-form hidden">
      <input type="text" id="register-username" placeholder="Username (min 3 characters)" required />
      <input type="password" id="register-password" placeholder="Password (min 8 characters)" required />
      <button type="submit">Register</button>
      <p class="auth-error" id="register-error"></p>
    </form>
  </section>

  <main id="app-main" class="hidden">
    <section class="panel" id="lineup-panel">
      <h2>Starting Lineup</h2>
      <div class="lineup-status" id="lineup-status"></div>
      <div class="pitch" id="pitch" hidden>
        <div class="pitch-row" id="row-fwd"></div>
        <div class="pitch-row" id="row-mid"></div>
        <div class="pitch-row" id="row-def"></div>
        <div class="pitch-row" id="row-gk"></div>
      </div>
      <div class="bench" id="bench" hidden>
        <span class="bench-label">Bench</span>
        <div class="bench-row" id="bench-row"></div>
      </div>
    </section>

    <section class="panel" id="mode-panel">
      <h2>Squad Mode</h2>
      <div class="mode-selector">
        <p>Are you building a new squad or entering your current squad?</p>
        <button id="mode-building" class="mode-btn">Build a new squad</button>
        <button id="mode-current" class="mode-btn">Enter my current squad</button>
      </div>
      <div id="mode-display" class="mode-display">Current mode: BUILDING</div>
    </section>

    <section class="panel" id="squad-panel">
      <h2>Your Squad</h2>
      <div class="squad-stats" id="squad-stats">Loading squad...</div>
      <div id="squad-list" class="squad-list"></div>
    </section>

    <section class="panel" id="add-player-panel">
      <h2>Add a Player</h2>
      <div class="search-row">
        <input type="text" id="search-input" placeholder="Search player name..." />
        <button id="search-btn">Search</button>
      </div>
      <div id="search-results" class="search-results"></div>
    </section>

    <section class="panel" id="advice-panel">
      <h2>Get AI Advice</h2>

      <div class="advice-block">
        <h3>Transfer Advice</h3>
        <div class="transfer-form">
          <select id="position-select">
            <option value="GK">GK</option>
            <option value="DEF">DEF</option>
            <option value="MID">MID</option>
            <option value="FWD">FWD</option>
          </select>
          <input type="number" id="max-price-input" placeholder="Max price £m" step="0.1" />
          <button id="transfer-advice-btn">Get Transfer Advice</button>
        </div>
        <div id="transfer-advice-result" class="advice-result"></div>
      </div>

      <div class="advice-block">
        <h3>Captain Advice</h3>
        <button id="captain-advice-btn">Get Captain Advice</button>
        <div id="captain-advice-result" class="advice-result"></div>
      </div>
    </section>
  </main>

  <footer id="app-footer" class="hidden">
    <span id="save-status"></span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
